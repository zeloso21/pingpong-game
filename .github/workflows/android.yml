name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 서명 키 준비 (없으면 한 번만 만들어 저장 — 이래야 업데이트 설치가 됨)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git add debug.keystore; git commit -m "debug keystore [skip ci]"; git push
          fi
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: 안드로이드 프로젝트 만들기
        run: |
          mkdir -p www && cp index.html three.min.js www/
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' "$S"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icons/* android/app/src/main/res/
          npx cap sync android
      - name: APK 빌드
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../pingpong.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 탁구 한 판 APK (최신)
          body: 안드로이드 핸드폰에서 pingpong.apk를 받아 설치하세요. (알 수 없는 앱 설치 허용 필요)
          files: pingpong.apk
